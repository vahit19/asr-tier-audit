[project]
name = "asr-tier-audit"
version = "0.1.0"
description = "Certifying per-language speech-recognition accuracy claims: normalizer-robust error rates and an anytime-valid tier test"
authors = [
    { name = "Vahit FERYAD", email = "vahit.feryat@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "jiwer>=4.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "whisper-normalizer>=0.1.15",
]

[project.scripts]
asr-tier-audit = "asr_tier_audit:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
